# This environment will install all the necessary dependencies to run the
# development version of PyDy, execute the tests, run the examples, and build
# the documentation. After the environment is activated, you can install the
# development version of PyDy into this environment with:
#
# `python -m pip install --no-deps --no-build-isolation -e .`
#
name: pydy-dev
channels:
  - conda-forge
dependencies:
  # #####################
  # required depedencies
  # #####################
  - numpy
  - packaging
  - python=3.*
  - scipy
  - setuptools
  - sympy
  # #####################
  # optional dependencies
  # #####################
  - cython
  - ipywidgets
  - jupyter
  - jupyterlab
  - matplotlib
  - pythreejs
  - symjit
  # pyvista
  # NOTE : I'm not exactly sure if I need all these for pyvista, nor why they
  # don't get installed as dependencies of pyvista.
  - nest_asyncio2
  - pyvista
  - trame
  - trame-vtk
  - trame-vuetify
  # ########################
  # development dependencies
  # ########################
  - coverage
  - ipython
  - jupyter_sphinx
  - numpydoc
  - pip
  - pytest
  - sphinx
